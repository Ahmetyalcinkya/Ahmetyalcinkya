
name: Generate Snake and Pac-Man

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Generate Snake contribution graph
      - name: Generate Snake
        uses: Platane/snk@master
        with:
          github_user_name: ahmetyalcinkya
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Back up Snake files before Pac-Man generation
      - name: Preserve Snake files
        run: |
          mkdir -p snake-backup
          cp dist/github-contribution-grid-snake.svg snake-backup/
          cp dist/github-contribution-grid-snake-dark.svg snake-backup/

      # Generate Pac-Man contribution graph
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ahmetyalcinkya
          games: pacman
          hide_month_labels: "false"

      # Restore Snake files into the final output directory
      - name: Restore Snake files
        run: |
          mkdir -p dist
          cp snake-backup/github-contribution-grid-snake.svg dist/
          cp snake-backup/github-contribution-grid-snake-dark.svg dist/

      # Publish both animations
      - name: Publish contribution animations
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
