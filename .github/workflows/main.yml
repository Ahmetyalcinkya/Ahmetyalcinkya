
name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ahmetyalcinkya
          github_repo_name: ahmetyalcinkya
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg
          theme: github
          hide_month_labels: "false"

      - name: Verify generated files
        run: |
          echo "Generated SVG files:"
          find dist -maxdepth 1 -type f -name "*.svg" -print

          test -f dist/pacman-contribution-graph.svg
          test -f dist/pacman-contribution-graph-dark.svg

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
